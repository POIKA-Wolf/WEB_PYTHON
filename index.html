<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GitHub Server Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .box { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 8px; }
        #status { margin-top: 20px; font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Hệ thống Test GitHub Server</h2>
        <button onclick="triggerGA()">BẬT ĐÈN TEST (GỌI PYTHON)</button>
        <div id="status">Trạng thái: Đang chờ lệnh...</div>
    </div>

    <script>
        // --- CẤU HÌNH API GITHUB ---
        const GITHUB_AUTH = "Bearer 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"; 
        const REPO_OWNER = "POIKA-Wolf";
        const REPO_NAME = "DO_AN";

        // --- CẤU HÌNH MQTT ---
        const mqtt_client = new Paho.MQTT.Client("f7a99425c8a34f23aba171e48336da3b.s1.eu.hivemq.cloud", 8884, "Web_Test_" + Math.random());
        
        mqtt_client.onMessageArrived = (msg) => {
            if(msg.destinationName === "web/test/response") {
                document.getElementById("status").innerText = "✔ " + msg.payloadString;
                document.getElementById("status").style.color = "green";
            }
        };

        mqtt_client.connect({
            useSSL: true,
            userName: "long140203",
            password: "Long140203",
            onSuccess: () => { 
                console.log("MQTT Connected"); 
                mqtt_client.subscribe("web/test/response");
            }
        });

        async function triggerGA() {
            document.getElementById("status").innerText = "Đang kích hoạt GitHub Actions...";
            
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': GITHUB_AUTH,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ event_type: 'trigger-test' })
                });

                if (response.status === 204) {
                    document.getElementById("status").innerText = "Đã gửi lệnh! Đang đợi máy ảo GitHub khởi động (khoảng 20s)...";
                } else {
                    document.getElementById("status").innerText = "Lỗi API: " + response.status;
                }
            } catch (error) {
                document.getElementById("status").innerText = "Lỗi kết nối tới GitHub API!";
            }
        }
    </script>
</body>
</html>
