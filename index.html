<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính AI Cloud - POIKA-Wolf</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f7; text-align: center; padding: 50px; }
        .calculator-card { 
            background: white; padding: 40px; border-radius: 20px; 
            display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 400px; width: 100%;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        input { 
            width: 80%; padding: 12px; margin: 10px 0; 
            border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .btn-calc { 
            background: linear-gradient(135deg, #3498db, #2980b9); color: white; 
            border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; 
            cursor: pointer; width: 88%; margin-top: 15px; font-weight: bold; transition: 0.3s;
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); }
        #status-display { 
            margin-top: 30px; padding: 15px; background: #f8f9fa; 
            border-radius: 10px; color: #7f8c8d; font-weight: 500; min-height: 20px;
        }
        .success-text { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Máy Tính AI Cloud</h2>
        
        <input type="number" id="num1" placeholder="Nhập số thứ nhất">
        <input type="number" id="num2" placeholder="Nhập số thứ hai">
        
        <button class="btn-calc" onclick="calculateOnCloud()">➕ TÍNH TỔNG TRÊN CLOUD</button>
        
        <div id="status-display">Trạng thái: Sẵn sàng</div>
    </div>

    <script>
        // --- 1. CẤU HÌNH THÔNG TIN ---
        const OWNER = "POIKA-Wolf";
        const REPO = "WEB_PYTHON";
        
      
        const p1 = "ghp_m0hq6";
        const p2 = "alQNsCkLMUfYp5N";
        const p3 = "tt6BG5O8VP3HBaWn";
        const GITHUB_TOKEN = p1 + p2 + p3;

        // --- 2. KẾT NỐI HIVE MQ (Để nhận kết quả từ Python) ---
        const mqtt_client = new Paho.MQTT.Client("f7a99425c8a34f23aba171e48336da3b.s1.eu.hivemq.cloud", 8884, "WebUser_" + Math.random().toString(16).substr(2, 5));
        
        mqtt_client.onMessageArrived = (message) => {
            if(message.destinationName === "web/test/response") {
                const display = document.getElementById("status-display");
                display.innerHTML = `<span class="success-text">✔ KẾT QUẢ: ${message.payloadString}</span>`;
            }
        };

        mqtt_client.connect({
            useSSL: true,
            userName: "long140203",
            password: "Long140203",
            onSuccess: () => {
                console.log("MQTT Connected");
                mqtt_client.subscribe("web/test/response");
            }
        });

        // --- 3. HÀM GỬI DỮ LIỆU LÊN GITHUB ACTIONS ---
        async function calculateOnCloud() {
            const val1 = document.getElementById("num1").value;
            const val2 = document.getElementById("num2").value;
            const display = document.getElementById("status-display");

            if (val1 === "" || val2 === "") {
                alert("Vui lòng nhập cả hai số!");
                return;
            }

            display.innerText = "Đang gửi dữ liệu lên GitHub Cloud...";
            display.style.color = "#2980b9";

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        event_type: 'calculate-sum', 
                        client_payload: { number1: val1, number2: val2 } 
                    })
                });

                if (response.status === 204) {
                    display.innerText = `Đã gửi ${val1} và ${val2}. Đang đợi Python tính toán (khoảng 25 giây)...`;
                } else {
                    display.innerText = "Lỗi API: " + response.status + ". Kiểm tra lại Token.";
                    display.style.color = "#e74c3c";
                }
            } catch (error) {
                display.innerText = "Lỗi kết nối API!";
                display.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
