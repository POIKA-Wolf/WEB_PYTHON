<div class="dashboard">
    <h2>Máy tính AI Cloud</h2>
    <input type="number" id="num1" placeholder="Số thứ nhất" style="padding:10px; width:80%; margin-bottom:10px;">
    <input type="number" id="num2" placeholder="Số thứ hai" style="padding:10px; width:80%; margin-bottom:10px;">
    
    <button class="btn-trigger" onclick="calculateOnCloud()">➕ TÍNH TỔNG TRÊN CLOUD</button>
    
    <div id="log-status">Kết quả sẽ hiện ở đây...</div>
</div>

<script>
        const OWNER = "POIKA-Wolf";
        const REPO = "WEB_PYTHON";
        const EVENT_TYPE = "trigger-test";

        // Kỹ thuật chia nhỏ mã Token để vượt qua bộ lọc bảo mật của GitHub
        const p1 = "ghp_m0hq6";
        const p2 = "alQNsCkLMUfYp5N";
        const p3 = "tt6BG5O8VP3HBaWn";

    async function calculateOnCloud() {
        const n1 = document.getElementById("num1").value;
        const n2 = document.getElementById("num2").value;
        const log = document.getElementById("log-status");

        if (n1 === "" || n2 === "") {
            alert("Vui lòng nhập đủ 2 số!");
            return;
        }

        const token = p1 + p2 + p3; // Ghép token từ các phần đã chia nhỏ
        log.innerText = "Đang gửi dữ liệu lên GitHub Server...";

        try {
            const response = await fetch(`https://api.github.com/repos/POIKA-Wolf/WEB_PYTHON/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                // Gửi kèm 2 số vào client_payload
                body: JSON.stringify({ 
                    event_type: 'calculate-sum', 
                    client_payload: { number1: n1, number2: n2 } 
                })
            });

            if (response.status === 204) {
                log.innerText = `Đã gửi ${n1} và ${n2}. Đang đợi Python tính toán...`;
            } else {
                log.innerText = "Lỗi API: " + response.status;
            }
        } catch (e) {
            log.innerText = "Lỗi kết nối!";
        }
    }
</script>
