<script>
    // --- CẤU HÌNH API GITHUB ---
    // LƯU Ý: Nếu lỗi 401, hãy tạo lại Token mới và kiểm tra quyền 'repo'
    const GITHUB_AUTH = "Bearer ghp_TẠO_MÃ_MỚI_VÀ_DÁN_VÀO_ĐÂY"; 
    const REPO_OWNER = "POIKA-Wolf";
    const REPO_NAME = "WEB_PYTHON"; // Đảm bảo tên này khớp 100% với tên Repo trên GitHub

    // --- CẤU HÌNH MQTT ---
    const mqtt_client = new Paho.MQTT.Client("f7a99425c8a34f23aba171e48336da3b.s1.eu.hivemq.cloud", 8884, "Web_Test_" + Math.random());
    
    mqtt_client.onMessageArrived = (msg) => {
        if(msg.destinationName === "web/test/response") {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "✔ " + msg.payloadString;
            statusDiv.style.color = "green";
        }
    };

    mqtt_client.connect({
        useSSL: true,
        userName: "long140203",
        password: "Long140203",
        onSuccess: () => { 
            console.log("MQTT Connected"); 
            mqtt_client.subscribe("web/test/response");
        }
    });

    async function triggerGA() {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = "Đang kích hoạt GitHub Actions...";
        statusDiv.style.color = "#2980b9";
        
        try {
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': GITHUB_AUTH,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ event_type: 'trigger-test' })
            });

            if (response.status === 204) {
                statusDiv.innerText = "Đã gửi lệnh! Đợi Python phản hồi (khoảng 20s)...";
            } else {
                statusDiv.innerText = "Lỗi API: " + response.status + " (Kiểm tra lại Token/Tên Repo)";
                statusDiv.style.color = "red";
            }
        } catch (error) {
            statusDiv.innerText = "Lỗi kết nối tới GitHub API!";
            statusDiv.style.color = "red";
        }
    }
</script>
